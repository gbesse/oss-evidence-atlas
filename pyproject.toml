[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-evidence-atlas"
version = "0.1.0a1"
description = "Preuves open source · Open-source evidence · Pruebas de código abierto"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["certifi==2026.10.18"]

[project.scripts]
evidence-atlas = "evidence_atlas.__main__:main"

[tool.setuptools.packages.find]
include = ["evidence_atlas*"]

[tool.setuptools.package-data]
evidence_atlas = ["web/*", "examples/*"]
